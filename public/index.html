<html lang="vi" data-cay-page="portal">
<head>

<meta name="theme-color" content="#171c1d">
<title>Cây Tri Ân Bốn Mùa</title>
<script src="./cay-presentation.js"></script>
<script>
const CONFIG = {
  ...window.CayPresentation?.config,
  // Điền tên cô và tên lớp như bạn muốn chúng xuất hiện trên trang.
  teacherName: "[TÊN CÔ]",
  className: "[TÊN LỚP]",
  autoPlay: true,
  seasonDuration: 15,
  slogan: "Xuân rồi sẽ đến, hạ rồi sẽ qua, thu sẽ thay lá và đông sẽ trở mình. Nhưng lòng biết ơn thì luôn ở lại.",
  // Một câu cho mỗi mùa theo thứ tự Xuân, Hạ, Thu, Đông. Bỏ trống để ẩn.
  seasonQuotes: [
    "Xuân về, những điều cô gieo lại nảy mầm.",
    "Nắng hạ còn vương nơi mái trường.",
    "Thu thay lá, kỷ niệm vẫn xanh.",
    "Đông trở mình, lòng biết ơn vẫn ở lại."
  ],
  resumeAfterDrag: 5, // Số giây chờ. Đặt 0 để luôn dừng sau khi chỉnh tay.
  quality: "auto",   // auto | high | low
  debug: false,      // true để ghi tên bụi trúng raycast trong console.
  // Thay từng tên trong mảng. Có thể thêm hoặc bớt học sinh.
  students: Array.from({ length: 30 }, (_, i) => `Học sinh ${i + 1}`),
  // student tính từ 0. Điền text và date, bỏ trống nếu chưa có dữ liệu.
  wishes: Array.from({ length: 30 }, (_, student) => ({ student, text: "", date: "" })),
  // student tính từ 0 như phần lời chúc. Bỏ dòng tạo 30 mục trống bên dưới và
  // thêm từng mục { student: 0, story: ``, date: "" } vào mảng items.
  // Dán chữ giữa hai dấu huyền, xuống dòng trực tiếp. Để story trống nếu chưa có.
  bushes: {
    enabled: true,
    heading: "Tâm sự của",
    items: [
      ...Array.from({ length: 30 }, (_, student) => ({ student, story: ``, date: "" }))
    ]
  },
  // images theo thứ tự Xuân, Hạ, Thu, Đông. Một ảnh sẽ dùng cho cả bốn mùa.
  // Dùng URL ảnh trực tiếp có hỗ trợ CORS, hoặc chuỗi data:image/...;base64,...
  // Nên dùng ảnh ngang, tối thiểu 1200px chiều rộng.
  // Điền caption và date nếu có. Vị trí null sẽ dùng ảnh giữ chỗ.
  photos: Array.from({ length: 14 }, () => ({ images: [null, null, null, null], caption: "", date: "" })),
  // Đổi enabled thành false để mở thẳng vào cây. Nhạc mặc định tắt.
  intro: {
    enabled: true,
    letter: {
      greeting: "Kính gửi cô [TÊN CÔ],", // [TÊN CÔ] sẽ lấy từ teacherName.
      paragraphs: ["Nội dung thư của lớp sẽ được điền ở đây. Đoạn 1.", "Đoạn 2.", "Đoạn 3."],
      closing: "Học trò của cô,",
      signature: "[Tên đại diện lớp]",
      date: "" // Để trống để ẩn ngày.
    },
    letterWriteSpeed: 1, // 1 = bình thường, tăng số để viết nhanh hơn.
    growDuration: 14, // Số giây cho cảnh cây lớn lên.
    introEndSeason: "auto", // auto theo tháng hiện tại | spring | summer | autumn | winter.
    showSkipButton: true,
    envelopeDuration: 3.6, // Số giây mở phong thư.
    seedDuration: 7.6, // Số giây từ chữ ký đến khi mầm nhú.
    revealDuration: 5.7, // Số giây hiện tiêu đề, ảnh, thẻ và các nút.
    letterReadDelay: 2.4, // Số giây tối thiểu để đọc sau khi thư hiện xong.
    skipDuration: 1.28 // Số giây chuyển cảnh khi bỏ qua.
  }
};
// Đổi pond thành true để hiện hồ nhỏ bên phải lối mòn.
const SCENE_OPTIONS = { pond: false };
</script>

<style>

.button { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 14px; border: 1px solid var(--line); border-radius: 100px; background: #303128a8; font-size: 11px; white-space: nowrap; transition: background .2s, border-color .2s }
.button:hover, .button[aria-pressed=true] { background: #4d4736; border-color: #e6cc9290 }
.icon { width: 40px; padding: 0 }
svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; flex: none }
header { position: fixed; z-index: 1; inset: max(22px,env(safe-area-inset-top)) 0 auto; text-align: center; pointer-events: none; padding: 0 154px; text-shadow: 0 2px 18px #151611b0 }
header h1 { margin: 0; color: #fff1db; font: 400 clamp(23px,3.075vw,35px)/1.09 var(--serif); letter-spacing: .038em; text-wrap: balance }

.tools.left { left: max(20px,env(safe-area-inset-left)) }

.season-controls { flex: 1; min-width: 0 }

body.inspecting :is(header, .tools, #timeline) { opacity: 0; pointer-events: none }
#treeDedication {

#treeDedication::before {

#treeMessage {

  font: italic 400 clamp(13px,1.35vw,17px)/1.28 var(--serif);

#treeMessage[data-visible] { opacity: 1; transform: translateY(0) }
body.intro-active #treeDedication,
body.inspecting #treeDedication,
#intro:not([hidden]) ~ #treeDedication {

}
@media (max-width: 680px) {
  #roster:not([hidden]) ~ #treeDedication { visibility: hidden }
}
@media (prefers-reduced-motion: reduce) {

}
#play { min-width: 71px; min-height: 32px; padding: 0 7px; font-size: 10px }
#track { position: relative; height: 27px; touch-action: none; cursor: ew-resize; border-radius: 8px }
#track::before { content: ""; position: absolute; inset: 13px 0 auto; height: 1px; background: linear-gradient(90deg,#e5cca790,#e1bd84bc,#e5cca75d) }
.tick, .thumb { position: absolute; top: 13px; left: var(--x); transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none }
.tick { width: 5px; height: 5px; background: #ead6ad; opacity: .85 }
.tick.minor { width: 1px; height: 6px; border-radius: 1px; opacity: .53 }
.tick.seam { width: 3px; height: 3px; opacity: .45 }
.thumb { z-index: 1; width: 12px; height: 12px; background: #fff1cf; box-shadow: 0 0 13px #f1c881b0 }
.seasons { position: relative; height: 20px }
.seasons button { position: absolute; left: var(--x); transform: translateX(-50%); background: none; border: 0; padding: 2px; color: #ece1c9; font-size: 12px; font-weight: 500; transition: color .18s }
.seasons button[aria-current=true] { color: #fff0c5; text-shadow: 0 0 11px #ffcd86; font-weight: 600 }
#roster { position: fixed; z-index: 3; top: max(72px,calc(env(safe-area-inset-top) + 52px)); left: max(20px,env(safe-area-inset-left)); width: min(325px,calc(100% - 28px)); max-height: min(530px,calc(100% - 176px)); padding: 17px; border-radius: 20px; display: flex; flex-direction: column; gap: 12px }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.panel-head h2 { font: 600 28px/1 var(--font); margin: 0 }
#search { width: 100%; border: 1px solid var(--line); background: #12151160; border-radius: 9px; padding: 9px 10px; font-size: 12px }
#names { min-height: 0; overflow: auto; margin: 0; padding: 0; list-style: none; overscroll-behavior: contain }
#names button { display: flex; text-align: left; align-items: center; gap: 10px; width: 100%; background: transparent; border: 0; padding: 10px 7px; border-radius: 6px; font-size: 12px }
#names button:hover { background: #f5dc9d1c }
#names .empty { color: #d3c9b7; opacity: .65 }
.number { min-width: 20px; color: #c9ac7e; font-size: 10px; font-variant-numeric: tabular-nums }
.read::after { content: ""; width: 5px; height: 5px; margin-left: auto; border-radius: 50%; background: #baa789 }
#hint { position: fixed; z-index: 4; pointer-events: none; border-radius: 20px; padding: 6px 11px; white-space: nowrap; font-size: 11px; transform: translate(-50%,-100%) }

#detail { z-index: 5; display: grid; place-items: center; padding: 20px; }
#closeDetail { position: absolute; top: max(19px,env(safe-area-inset-top)); right: max(19px,env(safe-area-inset-right)) }
#paper { width: min(530px,100%); max-height: 76dvh; overflow: auto; padding: clamp(24px,6vw,48px); background: linear-gradient(135deg,#faf0dc,#e9d8ba); color: #302b20; border: 1px solid #fff1cf; border-radius: 4px; box-shadow: 0 20px 70px #13110d80; text-align: center }
#paper h2 { font: 600 24px/1.1 var(--font); margin: 0 0 16px; color: #69583f }
#message { font: 600 clamp(26px,5vw,42px)/1.27 var(--font); white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 22px }
#message.missing { color: #766a56; opacity: .65 }
#author { font-size: 13px; font-weight: 600; margin: 6px 0 }
#wishDate, #photoDate { font-size: 11px; margin: 7px 0 0 }
#next { margin-top: 15px; color: #423521; border-color: #8a704765; background: #f0ddba }
#photoArea { position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%); width: min(82vw,680px,86vh); aspect-ratio: 1.39 }
#photoMeta { position: absolute; top: 79%; left: 50%; transform: translateX(-50%); width: min(86vw,680px); text-align: center; max-height: 15vh; overflow: auto; text-shadow: 0 1px 6px #0a100c; overflow-wrap: anywhere }
#caption { margin: 0; font: 600 clamp(21px,4vw,31px)/1.1 var(--font); white-space: pre-wrap }
@media (max-width: 680px) {
  header { top: calc(max(12px,env(safe-area-inset-top)) + 119px); padding: 0 16px }
  .tools { top: max(12px,env(safe-area-inset-top)) }
  .tools.left { left: max(12px,env(safe-area-inset-left)) }
  .right-hud {
    top: max(12px,env(safe-area-inset-top)); right: max(12px,env(safe-area-inset-right));

  }
  #roster { top: 0; left: 0; bottom: 0; max-height: none; padding: max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom)); border-radius: 0 18px 18px 0 }
  #timeline { width: 223px; gap: 12px; padding-right: 11px }
  #play { min-width: 63px; padding-inline: 4px }
}
/* Mở đầu của Cây Tri Ân. Giao diện của cây chỉ trở lại ở REVEAL. */
body.intro-active header {
  opacity: var(--intro-title,0);
  transform: translateY(calc(11px * (1 - var(--intro-title,0))));
}
body.intro-active .tools { opacity: var(--intro-hud,0); transform: translateY(calc(-9px * (1 - var(--intro-hud,0)))); }
body.intro-active #timeline {
  opacity: var(--intro-hud,0);
  transform: translateY(calc(-7px * (1 - var(--intro-hud,0))));
}
body.intro-active :is(header,.tools,#timeline) { pointer-events:none; transition:none }
#readLetter { gap:7px }
@media(max-width:900px) {
  #readLetter { width:40px; padding:0 }
  #readLetter span { display:none }
}
@media(max-width:365px) {
  .tools.right { gap:4px }
  .tools.right :is(.icon,#readLetter) { width:35px }
}
#intro {
  --veil:1; --env-time:3.6s; --tilt-x:0deg; --tilt-y:0deg;
  --hand:"Dancing Script","Be Vietnam Pro",cursive;
  --letter-title:"Cormorant Garamond","Be Vietnam Pro",Georgia,serif;
  --paper-grain:url("data:image/svg+xml,%3Csvg viewBox='0 0 144 144' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.69' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.29' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index:7; isolation:isolate; overflow:hidden; display:grid; place-items:center;
  padding:clamp(14px,4vw,36px);
}
#introBackdrop,#introVeil,#introDust,#envelopeStage,#letterStage { position:absolute; inset:0 }
#introBackdrop {
  z-index:-3; opacity:var(--veil); pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 15%,#ffcb7959 0%,#b16c352c 34%,transparent 67%),
    radial-gradient(ellipse at 50% 48%,#3b211780 29%,#0c0706 100%),
    repeating-linear-gradient(4deg,#633f2c 0px,#573625 5px,#66432d 8px,#4c2d20 14px,#503022 23px,#5d3826 32px);
}
#introBackdrop::after { content:""; position:absolute; inset:0; opacity:.27; background:var(--paper-grain); mix-blend-mode:soft-light }
#introVeil { z-index:6; background:#1a100ce8; pointer-events:none; opacity:var(--skip-veil,0) }
#introDust { z-index:-1; opacity:var(--veil); pointer-events:none; overflow:hidden }
#introDust i {
  position:absolute; width:var(--s); height:var(--s); border-radius:50%;
  background:#fbd094; box-shadow:0 0 7px #ffc877a0;
  animation:storyDust var(--life) var(--delay) infinite linear both;
}
@keyframes storyDust {
  0% { opacity:0; transform:translate3d(0,20px,0) }
  28%,68% { opacity:var(--o) }
  100% { opacity:0; transform:translate3d(35px,-84px,0) }
}
#envelopeStage,#letterStage { display:grid; place-items:center }
#envelopeStage { z-index:1; perspective:1000px; opacity:1; transition:opacity .62s ease }
#intro[data-stage=LETTER] #envelopeStage,#intro.paper-emerging #envelopeStage { opacity:0; pointer-events:none }
#envelopeWrap {
  transform:rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
  transition:transform .22s ease; will-change:transform;
}
#openEnvelope {
  position:relative; isolation:isolate; display:block; width:min(76vw,510px); aspect-ratio:1.66;
  border:0; border-radius:5px; padding:0; background:none; color:#51331e;
  transform:rotate(-5deg); animation:envelopeBreath 7s ease-in-out infinite;
}
#openEnvelope:hover { filter:brightness(1.06) }
@keyframes envelopeBreath { 50% { transform:translateY(-7px) rotate(-3.7deg) } }
.envelope-back,.envelope-insert,.envelope-pocket,.envelope-flap { position:absolute; inset:0; border-radius:5px; pointer-events:none }
.envelope-back {
  z-index:0;
  background:linear-gradient(155deg,#d8b889,#c7a473 68%,#b99466);
  box-shadow:0 27px 72px #080301bd,0 2px 9px #170c08a8;
}
.envelope-insert {
  z-index:1; inset:7% 9% 9%; border-radius:3px;
  background:repeating-linear-gradient(0deg,transparent 0 17px,#b7976224 17px 18px),linear-gradient(140deg,#fff5db,#ead6ab);
  box-shadow:0 3px 15px #33200d66;
}
.envelope-pocket {
  z-index:2; overflow:hidden; background:linear-gradient(155deg,#f3dbad,#d7b17f);
  clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%);
}
.envelope-pocket::after,.envelope-flap::after,.envelope-back::after,.story-paper::before {
  content:""; position:absolute; inset:0; background:var(--paper-grain); opacity:.37;
  mix-blend-mode:multiply; pointer-events:none; border-radius:inherit;
}
.envelope-pocket::before {
  content:""; position:absolute; inset:0; clip-path:polygon(0 100%,50% 49%,100% 100%);
  background:linear-gradient(5deg,#dab485,#efd4a5 63%,#ebc893);
}
.envelope-flap {
  z-index:3; transform-origin:top center; background:linear-gradient(165deg,#f9e6bb,#ebc999 57%,#d8b284);
  clip-path:polygon(0 0,100% 0,100% 2%,55% 56%,52% 59%,48% 59%,45% 56%,0 2%);
  filter:drop-shadow(0 2px 1px #7a4f3260);
}
.envelope-address {
  position:absolute; z-index:4; inset:75% 7% auto; text-align:center; overflow-wrap:anywhere;
  font:600 clamp(22px,5vw,45px)/1 var(--hand); color:#64422a;
  text-shadow:0 1px #fff5d09e;
}
.wax-seal {
  position:absolute; z-index:5; left:50%; top:57%; width:clamp(40px,11%,64px); aspect-ratio:1;
  transform:translate(-50%,-50%); filter:drop-shadow(0 4px 4px #5a261e6e); pointer-events:none;
}
.wax-part {
  position:absolute; inset:0; display:grid; place-items:center; border-radius:48% 53% 46% 52%;
  background:radial-gradient(circle at 37% 27%,#a14a47,#762934 62%,#481921);
  box-shadow:inset 0 0 0 2px #6f2b36,inset 0 3px 3px #c5706555,inset 0 -5px 8px #320e16a8;
}
.wax-part:first-child { clip-path:polygon(0 0,49% 0,55% 24%,47% 45%,53% 64%,46% 82%,51% 100%,0 100%) }
.wax-part:nth-child(2) { clip-path:polygon(49% 0,100% 0,100% 100%,51% 100%,46% 82%,53% 64%,47% 45%,55% 24%) }
.wax-part svg { width:79%; height:79%; color:#dea08b; opacity:.77; stroke-width:.75 }
.wax-crack { position:absolute; inset:0; width:100%; height:100%; color:#331116; stroke-width:1.25; opacity:0 }
#intro.is-opening #openEnvelope { animation:none; cursor:default }
#intro.is-opening .wax-crack { animation:waxCrack var(--env-time) ease both }
#intro.is-opening .wax-part:first-child { animation:waxLeft var(--env-time) ease-in both }
#intro.is-opening .wax-part:nth-child(2) { animation:waxRight var(--env-time) ease-in both }
#intro.is-opening .envelope-flap { animation:flapOpen var(--env-time) ease-in-out both }
#intro.is-opening .envelope-insert { animation:insertRise var(--env-time) ease-in-out both }
@keyframes waxCrack { 0%,7%{opacity:0} 13%,23%{opacity:1} 30%,100%{opacity:0} }
@keyframes waxLeft { 0%,16%{transform:none;opacity:1} 40%,100%{transform:translate(-44px,143px) rotate(-64deg);opacity:0} }
@keyframes waxRight { 0%,16%{transform:none;opacity:1} 42%,100%{transform:translate(51px,151px) rotate(79deg);opacity:0} }
@keyframes flapOpen { 0%,19%{transform:rotateX(0)} 53%,100%{transform:rotateX(172deg)} }

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/dist/umd/supabase.min.js"></script>
<script src="./cay-config.js"></script>
<script src="./cay-data.js"></script>
<script>
(async () => {
  "use strict";
  if (!await window.CayData.start(CONFIG)) return;
  if (CONFIG.publicView) {
    document.getElementById("readLetter").hidden=true;
    document.getElementById("fallbackPhotos").hidden=true;
    document.getElementById("bushNav").hidden=true;
    document.getElementById("bushUnlock").hidden=false;
    document.getElementById("bushAuthor").hidden=true;
  }
  const STAGES = Object.freeze({
    ENVELOPE:"ENVELOPE", LETTER:"LETTER", SEED:"SEED", GROW:"GROW", REVEAL:"REVEAL", EXPLORE:"EXPLORE"
  });
  const NEXT = {
    ENVELOPE:STAGES.LETTER, LETTER:STAGES.SEED, SEED:STAGES.GROW, GROW:STAGES.REVEAL, REVEAL:STAGES.EXPLORE
  };
  const byId = id=>document.getElementById(id);
  const cap = (value,min=0,max=1)=>Math.max(min,Math.min(max,value));
  const ease = (a,b,value)=>{
    const p=cap((value-a)/(b-a));
    return p*p*(3-2*p);
  };

  // Tải r128 ở nền để mất kết nối với CDN không khóa phần mở đầu.
  let threeRequest;
  function loadThree(retry) {
    const loaded=()=>window.THREE?.REVISION==="128";
    if(loaded()) return Promise.resolve(true);
    if(threeRequest) return threeRequest;
    const urls=[
      "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js",
      "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"
    ];
    function request(url) {
      return new Promise(resolve=>{
        const script=document.createElement("script");
        function finish(ok) {
          clearTimeout(timeout);
          script.onload=script.onerror=null;
          script.remove();
          resolve(ok);
        }
        const timeout=setTimeout(()=>finish(loaded()),3800);
        script.onload=()=>finish(loaded());
        script.onerror=()=>finish(loaded());
        script.async=true;
        script.src=retry ? url+"?retry="+Date.now() : url;
        document.head.append(script);
      });
    }
    threeRequest=(async()=>{
      for(const url of urls) if(loaded() || await request(url)) return true;
      return loaded();
    })().finally(()=>{ threeRequest=null; });
    return threeRequest;
  }

  const smallScreen=matchMedia("(pointer: coarse), (max-width: 680px)").matches;
  const treeMessage=byId("treeMessage");
  byId("treeSlogan").textContent=CONFIG.slogan;
  let quoteSeason=-1, quoteFade=0, quoteSwap=0;
  function showSeasonQuote(season) {
    if(season===quoteSeason) return;
    quoteSeason=season;
    clearTimeout(quoteFade); clearTimeout(quoteSwap);
    const quote=String(CONFIG.seasonQuotes?.[season]??"").trim();
    const visible=treeMessage.hasAttribute("data-visible");
    treeMessage.removeAttribute("data-visible");
    function appear() {
      treeMessage.textContent=quote;
      if(!quote) return;
      treeMessage.setAttribute("data-visible","");
      quoteFade=setTimeout(()=>treeMessage.removeAttribute("data-visible"),4600);
    }
    if(visible) quoteSwap=setTimeout(appear,320);
    else appear();
  }

  const studentNames=CONFIG.students.map((name,i)=>String(name??"").trim()||`Học sinh ${i+1}`);
  const bushConfig=CONFIG.bushes;
  const bushData=new Map(bushConfig?.enabled ? (bushConfig.items??[]).map(item=>[item.student,item]) : []);
  const studentStories=studentNames.map((name,index)=>{
    const data=bushData.get(index), text=String(data?.story??"");

    const photos = Array.isArray(data?.photos) ? data.photos : [];
    return {name,index,text,photos,date:String(data?.date??"").trim(),hasStory:!!text.trim() || photos.length > 0};
  });
  const readableStories=studentStories.filter(item=>item.hasStory), readStories=new Set();
  const reader=byId("bushReader"), readerScroll=byId("bushScroll"), progress=byId("bushProgress");
  const readerPrev=byId("bushPrev"), readerNext=byId("bushNext"), readerClose=byId("bushClose");
  let readerStudent=-1, readerPrevious, readerFollowing, readerNavigate=null, readerReturn=null;
  function updateBushProgress() {
    progress.hidden=!readableStories.length;
    progress.textContent=readableStories.length ? `Đã đọc ${readStories.size}/${readableStories.length} tâm sự` : "";
  }
  function scrollFades() {
    const {scrollTop,scrollHeight,clientHeight}=readerScroll;
    readerScroll.style.setProperty("--bush-fade-top",scrollTop>2 ? "12px" : "0px");
    readerScroll.style.setProperty("--bush-fade-bottom",scrollHeight-clientHeight-scrollTop>2 ? "12px" : "0px");
  }
const photosInStory = byId("cayStoryPhotos"), photoZoom = byId("cayPhotoZoom");
  const zoomImage = photoZoom.querySelector("img");
  let photoCleanups = [];
  photoZoom.addEventListener("close",() => zoomImage.removeAttribute("src"));
  function clearStoryPhotos() {
    photoCleanups.forEach(revoke => revoke());
    photoCleanups = [];
    photosInStory.replaceChildren();
    photosInStory.hidden = true;
  }
  reader.addEventListener("close",clearStoryPhotos);
  function showStoryPhotos(paths) {
    clearStoryPhotos();
    photosInStory.hidden = !paths.length;
    paths.forEach((path,i) => {
      const picture = document.createElement("button");
      picture.type = "button";
      picture.disabled = true;
      picture.textContent = "Đang tải ảnh…";
      picture.setAttribute("aria-label","Mở ảnh " + (i+1));
      const image = document.createElement("img");
      image.alt = "Ảnh kỷ niệm " + (i+1);
      photosInStory.append(picture);
      picture.addEventListener("click",() => {
        zoomImage.src = image.src;
        photoZoom.showModal();
      });
      window.CayData.openStoryPhoto(path,image).then(revoke => {
        if (!picture.isConnected) { revoke(); return; }
        photoCleanups.push(revoke);
        picture.replaceChildren(image);
        picture.disabled = false;
        scrollFades();
      }).catch(() => { picture.textContent = "Chưa tải được ảnh"; });
    });
  }
  function readBush(index,navigate,returnToScene) {
    const item=studentStories[index];
    if(!item) return;
    readerStudent=index; readerNavigate=navigate; readerReturn=returnToScene;
    readerPrevious=readerFollowing=undefined;
    for(const entry of readableStories) {
      if(entry.index<index) readerPrevious=entry.index;
      else if(entry.index>index) { readerFollowing=entry.index; break; }
    }
    if(item.hasStory) { readStories.add(index); updateBushProgress(); }
    byId("bushHeading").textContent=CONFIG.publicView ? "Tâm sự riêng tư" : `${String(bushConfig.heading??"").trim()||"Tâm sự của"} ${item.name}`;
    byId("bushText").textContent=CONFIG.publicView ? "Phần này được khóa. Cô nhập mã riêng để đọc tâm sự." : item.hasStory ? item.text : "Chưa có tâm sự";
    byId("bushText").hidden=item.hasStory && !item.text.trim();
    showStoryPhotos(item.photos);
    byId("bushText").classList.toggle("missing",!CONFIG.publicView && !item.hasStory);
    byId("bushAuthor").textContent=item.name;
    byId("bushDate").textContent=item.hasStory ? item.date : "";
    byId("bushDate").hidden=!item.hasStory || !item.date;
    reader.classList.toggle("compact",!item.hasStory || (item.text.length<=220 && item.text.split("\n").length<=6));
    readerPrev.disabled=readerPrevious===undefined; readerNext.disabled=readerFollowing===undefined;
    reader.removeAttribute("data-travel");
    if(!reader.open) reader.showModal();
    readerScroll.scrollTo({top:0,behavior:"instant"});
    scrollFades(); readerClose.focus({preventScroll:true});
  }
  function stepBushReader(step) {
    if(reader.hasAttribute("data-travel")) return;
    const index=step<0 ? readerPrevious : readerFollowing;
    if(index!==undefined) readerNavigate?.(index);
  }
  readerScroll.addEventListener("scroll",scrollFades,{passive:true});
  if(typeof ResizeObserver==="function") new ResizeObserver(scrollFades).observe(readerScroll);
  readerClose.addEventListener("click",()=>reader.close());
  readerPrev.addEventListener("click",()=>stepBushReader(-1));
  readerNext.addEventListener("click",()=>stepBushReader(1));
  reader.addEventListener("keydown",event=>{
    if(event.key!=="ArrowLeft" && event.key!=="ArrowRight") return;
    event.preventDefault(); stepBushReader(event.key==="ArrowLeft" ? -1 : 1);
  });
  reader.addEventListener("click",event=>{
    if(event.target!==reader) return;
    const bounds=reader.getBoundingClientRect();
    if(event.clientX<bounds.left || event.clientX>bounds.right || event.clientY<bounds.top || event.clientY>bounds.bottom) reader.close();
  });
  reader.addEventListener("close",()=>{
    reader.removeAttribute("data-travel");
    const restore=readerReturn;
    readerStudent=-1;
    readerReturn=readerNavigate=null;
    restore?.();
  });
  updateBushProgress();
  function markStudentStory(button) {
    const dot=document.createElement("span");
    dot.className="student-dot"; dot.setAttribute("aria-label","Có tâm sự");
    button.append(dot);
  }

  // Chế độ 2D vẫn mở được thư, lời chúc, tâm sự và ảnh từ CONFIG.
  function setupFallback(initialSeason,retry) {
    const root=byId("fallbackScene"), canvas=byId("fallbackCanvas"), dock=byId("fallbackDock");
    const panel=byId("fallbackPanel"), title=byId("fallbackTitle"), content=byId("fallbackContent");
    const retryButton=byId("fallbackRetry"), status=byId("fallbackStatus");
    const wishes=new Map(CONFIG.wishes.map(wish=>[wish.student,wish]));
    const colors=[
      ["#78617a","#f1b992","#4e6a49","#73513c",["#bdc77c","#90a463","#e4a7a3"]],
      ["#326e9a","#afe0e1","#345c40","#604635",["#587b47","#789551","#a9b971"]],
      ["#64486c","#e9a178","#756141","#654434",["#e4ab5d","#bc6a43","#d58c43"]],
      ["#263856","#9caebf","#899f9d","#544a42",["#bdcbd2","#aabdc9","#976e55"]]
    ];
    let season=initialSeason, pendingResize=0;
    function make(tag,text) {
      const node=document.createElement(tag);
      node.textContent=text;
      return node;
    }
    function button(text,action) {
      const node=make("button",text);
      node.className="button"; node.addEventListener("click",action);
      return node;
    }
    function open(heading) {
      title.textContent=heading;
      content.replaceChildren(); panel.scrollTop=0;
      if(!panel.open) panel.showModal();
    }
    function showWish(index,name) {
      open(name);
      const wish=wishes.get(index), text=String(wish?.text??"").trim();
      const paragraph=make("p",text||"Chưa có lời chúc");
      if(!text) paragraph.className="fallback-muted";
      content.append(paragraph);
      if(wish?.date) content.append(make("time",wish.date));
      content.append(button("Về danh sách lớp",showWishes));
      content.lastElementChild.focus();
    }
    function showWishes() {
      open("Danh sách lớp");
      const input=document.createElement("input"), list=document.createElement("ol");
      input.type="search"; input.placeholder="Tìm tên học sinh";
      input.setAttribute("aria-label","Tìm tên học sinh");
      const normalize=name=>name.toLowerCase().normalize("NFD").replace(/\p{M}/gu,"").replace(/đ/g,"d");
      const rows=studentStories.map(({name,index,hasStory})=>{
        const row=document.createElement("li");
        row.value=index+1;
        if(bushConfig?.enabled) {
          const line=make("div",""), main=button(name,()=>showStory(index));
          line.className="student-line";
          main.classList.toggle("empty",!hasStory);
          if(hasStory) markStudentStory(main);
          const wish=button("Lời chúc",()=>showWish(index,name));
          wish.classList.add("wish-link"); wish.setAttribute("aria-label",`Lời chúc của ${name}`);
          line.append(main,wish); row.append(line);
        } else row.append(button(name,()=>showWish(index,name)));
        list.append(row);
        return {row,name:normalize(name)};
      });
      input.addEventListener("input",()=>{
        const term=normalize(input.value.trim());
        for(const {row,name} of rows) row.hidden=!name.includes(term);
      });
      content.append(input,list);
    }
    function showStory(index) {
      // Giữ danh sách ở dưới để khi đóng thẻ, trình duyệt trả tiêu điểm đúng hàng.
      storySound?.tone(659.25,.7,.036);
      readBush(index,showStory,null);
    }
    function showPhotos() {
      open("Ảnh kỷ niệm");
      const album=document.createElement("div"); album.className="fallback-album";
      CONFIG.photos.forEach((photo,i)=>{
        const figure=document.createElement("figure"), label=`Ảnh ${i+1}`;
        const placeholder=make("div",label);
        placeholder.className="fallback-photo"; placeholder.style.backgroundColor=colors[season][4][0];
        const images=photo.images??[], available=images.filter(src=>typeof src==="string" && src.trim());
        const src=!photo.metaBySeason && available.length===1 ? available[0] : images[season];
        if(src) {
          const image=document.createElement("img"); image.alt=label; image.loading="lazy";
          image.addEventListener("error",()=>image.replaceWith(placeholder),{once:true});
          figure.append(image); image.src=src;
        } else figure.append(placeholder);
        const meta=photo.metaBySeason?.[season] ?? photo;
        if(meta.caption) figure.append(make("p",meta.caption));
        if(meta.date) figure.append(make("time",meta.date));
        album.append(figure);
      });
      content.append(album);
    }
    function paint() {
      pendingResize=0;
      if(root.hidden) return;
      const width=root.clientWidth,height=root.clientHeight;
      if(!width || !height) return;
      const dockTop=dock.getBoundingClientRect().top;
      document.body.style.setProperty("--fallback-bottom",`${height-dockTop}px`);
      const ctx=canvas.getContext("2d");
      if(!ctx) return;
      canvas.width=width; canvas.height=height;
      const [sky,horizon,earth,bark,leaf]=colors[season], ground=height*.68;
      const gradient=ctx.createLinearGradient(0,0,0,ground);
      gradient.addColorStop(0,sky); gradient.addColorStop(1,horizon);
      ctx.fillStyle=gradient; ctx.fillRect(0,0,width,height);
      const sx=width*.69,sy=height*.27, glow=ctx.createRadialGradient(sx,sy,0,sx,sy,height*.32);
      glow.addColorStop(0,season===3?"#f8f5ddcf":"#ffe9b6f0"); glow.addColorStop(1,"#fff3c400");
      ctx.fillStyle=glow; ctx.fillRect(0,0,width,height);
      ctx.fillStyle="#fff1cf"; ctx.beginPath(); ctx.arc(sx,sy,Math.min(width,height)*.031,0,Math.PI*2); ctx.fill();
      for(let layer=0;layer<4;layer++) {
        ctx.beginPath(); ctx.moveTo(0,height);
        for(let i=0;i<=32;i++) {
          const y=ground*(.66+layer*.087)+height*(Math.sin(i*.27+layer)*.052+Math.sin(i*.57-layer)*.022);
          ctx.lineTo(i*width/32,y);
        }

  // Cùng một bộ âm thanh cho phong thư, nhạc mở đầu và cảnh khám phá.

      for(const button of [sceneButton,storyButton]) button.setAttribute("aria-pressed",String(state.enabled));
      storyButton.textContent=state.enabled ? "Âm thanh bật" : "Âm thanh tắt";

  let storySound;

  function setupIntro(bootScene) {

    const rings=Array.from({length:2},()=>{
      const ring=mesh(new THREE.RingGeometry(.91,1,64),new THREE.MeshBasicMaterial({
        color:"#ffd698",transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,side:THREE.DoubleSide
      }),sceneFx);
      ring.rotation.x=-Math.PI/2;
      return ring;
    });
    const ground=height(0,0);
    const crackPoints=[];
    for(let j=0;j<7;j++) {
      const angle=j*2.399, length=.27+(j%4)*.093;
      const x=Math.cos(angle),z=Math.sin(angle);
      const start=vec(x*.05,0,z*.05), joint=vec(x*length*.55-z*.04,0,z*length*.55+x*.04);
      const tip=vec(x*length,0,z*length);
      const offshoot=vec(joint.x+x*.08+z*.10,0,joint.z+z*.08-x*.10);
      for(const [a,b] of [[start,joint],[joint,tip],[joint,offshoot]]) {
        const vx=b.x-a.x,vz=b.z-a.z;
        crackPoints.push(a.x,0,a.z,a.x+vz*.05,0,a.z-vx*.05,b.x,0,b.z);
      }
    }
    const crackGeo=new THREE.BufferGeometry();
    crackGeo.setAttribute("position",new THREE.Float32BufferAttribute(crackPoints,3));
    const crack=mesh(crackGeo,new THREE.MeshBasicMaterial({
      color:"#362715",transparent:true,opacity:0,depthWrite:false,side:THREE.DoubleSide,polygonOffset:true,polygonOffsetFactor:-1
    }),sceneFx);
    crack.position.y=ground+.012;
    const specks=new Float32Array(26*3);
    const dustGeo=keep(new THREE.BufferGeometry());
    const coords=new THREE.BufferAttribute(specks,3);
    coords.setUsage(THREE.DynamicDrawUsage); dustGeo.setAttribute("position",coords);
    const dust=new THREE.Points(dustGeo,keep(new THREE.PointsMaterial({
      map:glow,color:"#d0a57c",size:.095,transparent:true,opacity:0,depthWrite:false,fog:false
    })));
    dust.frustumCulled=false; sceneFx.add(dust);
    const sprout=new THREE.Group(), juvenile=new THREE.Group();
    sceneFx.add(sprout,juvenile);
    const sproutStem=new THREE.CylinderGeometry(.012,.028,.42,8);
    sproutStem.translate(0,.21,0);
    const green=new THREE.MeshBasicMaterial({color:"#78a95c",side:THREE.DoubleSide,transparent:true});
    mesh(sproutStem,green,sprout);
    const firstLeaves=leafShape();
    for(const sign of [-1,1]) {
      const leaf=mesh(firstLeaves,green,sprout);
      leaf.position.set(0,.365,0); leaf.rotation.set(.43,sign*.28,sign*1.05); leaf.scale.set(.38,.42,.35);
      const young=mesh(firstLeaves,new THREE.MeshBasicMaterial({color:"#9db968",side:THREE.DoubleSide,transparent:true}),juvenile);
      young.rotation.set(.3,sign*.6,sign*1.08); young.scale.set(.42,.49,.40);
    }
    const breath=new THREE.Sprite(keep(shine.material.clone()));
    breath.position.set(.04,6.35,.15); breath.scale.set(11,8,1); sceneFx.add(breath);
    return {sceneFx,drop,shine,trail,rings,crack,dust,coords,sprout,juvenile,breath,ground};
  }
  const storyFx=makeStoryEffects();
  const seedSpot=vec(0,0,0);
  function seedPosition(p,out) {
    const descent=smooth(.27,.80,p);
    const sink=smooth(.80,.93,p);
    out.set(Math.sin(descent*Math.PI)*.53-.24*(1-descent),
      mix(3.45,storyFx.ground+.063,descent)-sink*.11,
      Math.sin(descent*Math.PI*1.12)*.29);
  }
  function showStoryEffects() {
    const {sceneFx,drop,shine,trail,rings,crack,dust,coords,sprout,juvenile,breath,ground}=storyFx;
    const stage=story.state.stage, p=story.phaseProgress;
    const inSeed=stage===STAGES.SEED && !story.state.skipping;
    const inGrow=stage===STAGES.GROW && !story.state.skipping;
    const inReveal=stage===STAGES.REVEAL && !story.state.skipping;
    sceneFx.visible=inSeed || inGrow || inReveal;
    if(!sceneFx.visible) return;
    const dropAlpha=inSeed ? smooth(.28,.42,p)*(1-smooth(.80,.91,p)) : 0;
    drop.visible=shine.visible=dropAlpha>.001;
    if(drop.visible) {
      seedPosition(p,seedSpot); drop.position.copy(seedSpot); shine.position.copy(seedSpot);
      drop.rotation.z=Math.cos(p*6)*.36; drop.material.opacity=dropAlpha;
      shine.scale.setScalar(.81+Math.sin(clock*3)*.11);
      shine.material.opacity=dropAlpha*.62;
    }
    trail.forEach((part,i)=>{
      const delay=(i+1)*.009, alpha=inSeed ? smooth(.35,.52,p)*(1-smooth(.79,.92,p))*(1-i/trail.length)*.38 : 0;
      part.visible=alpha>.003;
      if(part.visible) {
        seedPosition(p-delay,part.position); part.scale.setScalar(.35-i*.027); part.material.opacity=alpha;
      }
    });
    rings.forEach((ring,i)=>{
      const r=(p-.79-i*.018)/(.16-i*.015);
      ring.visible=inSeed && r>0 && r<1;
      if(ring.visible) {
        ring.position.y=ground+.023+i*.006;
        ring.scale.setScalar(.08+r*(1.82+i*.54));
        ring.material.opacity=Math.sin(Math.PI*r)*(i===0 ? .57 : .30);
      }
    });
    const pulse=inSeed ? (p-.79)/.15 : 1;
    dust.visible=pulse>0 && pulse<1;
    if(dust.visible) {
      const f=smooth(0,1,pulse);
      for(let i=0;i<coords.count;i++) {
        const theta=i*2.399,r=(.24+(i%9)*.071)*f;
        coords.setXYZ(i,Math.cos(theta)*r,ground+.04+Math.sin(Math.PI*pulse)*(.10+(i%8)*.048),Math.sin(theta)*r);
      }
      coords.needsUpdate=true; dust.material.opacity=Math.sin(Math.PI*pulse)*.74;
    }
    const fissure=inSeed ? smooth(.79,.84,p)*.64 : inGrow ? (1-smooth(0,.22,p))*.64 : 0;
    crack.visible=fissure>.001; crack.material.opacity=fissure;
    const shoot=inGrow ? smooth(0,.115,p)*(1-smooth(.27,.42,p)) : 0;
    sprout.visible=shoot>.001;
    if(sprout.visible) {
      sprout.position.set(0,ground,0); sprout.scale.set(.48+.72*shoot,Math.max(.01,shoot)*1.30,.48+.72*shoot);
      sprout.rotation.z=Math.sin(clock*1.82)*.062;
      sprout.children[0].material.opacity=shoot;
    }
    const youngster=inGrow ? smooth(.12,.22,growth)*(1-smooth(.46,.60,growth)) : 0;
    juvenile.visible=youngster>.001;
    if(juvenile.visible) {
      const base=trunk.getPointAt(0), tip=trunk.getPointAt(1);
      juvenile.position.copy(base.lerp(tip,smooth(.09,.43,growth)));
      juvenile.position.y*=treeHeight;
      juvenile.scale.setScalar(.55+growth*1.14);
      juvenile.children.forEach(leaf=>{leaf.material.opacity=youngster;leaf.material.color.copy(U.grass.value).lerp(U.sun.value,.32);});
    }
    breath.visible=inReveal && p<.32;
    if(breath.visible) {
      breath.material.opacity=Math.sin(Math.PI*clamp(p/.32,0,1))*.20;
      breath.scale.set(9+p*18,6+p*12,1);
    }
  }

  // Giữ nguyên góc quan sát mặc định sau khi máy quay rời mầm cây.
  function placeStoryCamera() {
    const state=story.state, p=story.phaseProgress;
    if(story.skipMature || state.stage===STAGES.REVEAL || !CONFIG.intro.enabled) {
      rig.az=.19; rig.polar=1.456; rig.distance=24; rig.aim.set(0,5.07,0);
    } else if(state.stage===STAGES.SEED || story.warm) {
      const s=smooth(0,1,p);
      rig.az=mix(.33,.31,s); rig.polar=1.34; rig.distance=mix(8.4,7,s);
      rig.aim.set(0,mix(1.52,.67,s),0);
    } else if(state.stage===STAGES.GROW) {
      const s=smooth(0,1,p), shake=reduce ? 0 : Math.sin(Math.PI*p)*.008;
      rig.az=mix(.31,.19,s)+Math.sin(clock*1.47)*shake;
      rig.polar=mix(1.34,1.456,s)+Math.sin(clock*1.12)*shake*.62;
      rig.distance=mix(7,24,s); rig.aim.set(0,mix(.67,5.07,s)+Math.cos(clock*1.6)*shake*5,0);
    }
    goal.az=rig.az; goal.polar=rig.polar; goal.distance=rig.distance; goal.aim.copy(rig.aim);
  }
  function seasonalIntro() {
    if(story.skipMature || story.state.stage===STAGES.REVEAL) return story.endSeason;
    if(story.state.stage!==STAGES.GROW) return 0;
    const p=story.phaseProgress;
    const cycle=4*Math.pow(Math.min(1,p/.88),1.24);
    const turn=story.endSeason===3 ? -1 : story.endSeason;
    return mod(cycle+turn*smooth(.88,1,p));
  }
  function unveil(item,photo) {
    if(story.explore || story.skipMature) return 1;
    if(story.state.stage!==STAGES.REVEAL) return 0;
    const t=story.phaseProgress;
    const rank=item.index/Math.max(1,(photo ? photos : tags).length-1);
    const start=photo ? .205+rank*.154 : .525+rank*.219;
    return smooth(start,start+(photo ? .085 : .053),t);
  }
  renderer.domElement.addEventListener("webglcontextlost",event=>{
    event.preventDefault(); lost=true;
    if(reader.open && readerReturn===returnFromBush) reader.close();
    if(inspection) objects.add(inspection.item.group);
    inspection=pending=tour=null; home=null; detail.hidden=true;
    document.body.classList.remove("inspecting");
    setRoster(false); showHover(null);
    story.onContextLost();
  });
  renderer.domElement.addEventListener("webglcontextrestored",()=>{ lost=false; resize(); story.onContextRestored(); });
  let last=0, sample=0, frames=0;
  document.addEventListener("visibilitychange",()=>{ last=0; sample=frames=0; });
  function frame(now) {
    if(document.hidden || lost || (!story.needsWorld && !story.warm)) {
      last=0; raf=requestAnimationFrame(frame);
      return;
    }
    const elapsed=last ? (now-last)/1000 : .016, dt=Math.min(.4,elapsed);
    last=now; clock+=dt;
    const inExplore=story.explore, firstExplore=inExplore&&!started;
    if (firstExplore) {
      if (!CONFIG.intro.enabled) placeStoryCamera();
      started=true; age=2.8; touchScene();
      targetPhase=CONFIG.intro.enabled ? story.endSeason : 0;
      U.phase.value=targetPhase;
    }
    if (inExplore) {
      if (!story.state.review) age+=dt;
      if (clock>=resumeAt) { playing=true; resumeAt=Infinity; playback(); }
      if (playing && !firstExplore && !story.state.review) targetPhase+=dt/Math.max(1,CONFIG.seasonDuration);
      phase=mod(U.phase.value+(mod(targetPhase-U.phase.value+2)-2)*(1-Math.exp(-dt*12)));
    } else {
      phase=seasonalIntro(); targetPhase=phase;
      placeStoryCamera();
    }
    growth=inExplore || story.skipMature || story.state.stage===STAGES.REVEAL ? 1 :
      story.state.stage===STAGES.GROW ? smooth(0,1,story.phaseProgress) : 0;
    U.clock.value=clock; U.growth.value=growth; U.fx.value=mix(U.fx.value,effects?1:0,1-Math.exp(-dt*7));
    tree.scale.set(1,treeHeight,1); tree.visible=growth>.105;
    season(phase); animateNature(phase,dt); reflect(); cameraStep(dt);
    moveInspection(dt); animateRecords(dt); advanceTour(); animateBushes(dt); showStoryEffects();
    if(hover?.type==="bush") positionBushHint(hover);
    if (inExplore && !story.state.review) { story.sound.bed(0,true); ambient(); }
    if (!adaptive && CONFIG.quality==="auto" && story.needsWorld && !inspection && !document.hidden) {
      sample+=elapsed; frames++;
      if (sample>2.6) {
        if (frames/sample<(smallScreen ? 43 : 45)) {
          low=adaptive=true; limited.forEach(({item,budget})=>{item.count=budget;}); setEffects(false); resize();
        }
        sample=frames=0;
      }
    }
    if (!lost) { paintShadows(); draw(); story.state.warming=false; }
    raf=requestAnimationFrame(frame);
  }
  raf=requestAnimationFrame(frame);
  addEventListener("pagehide",event=>{
    if (event.persisted) return;
    disposed=true; cancelAnimationFrame(raf); cancelAnimationFrame(resizeFrame); removeEventListener("resize",queueResize);
    assets.forEach(asset=>asset.dispose()); renderer.dispose();
  });
  return {
    available:()=>!lost && !renderer.getContext().isContextLost(),
    restore:()=>{ if(lost) contextRecovery?.restoreContext(); }
  };
  }
})();
</script>
