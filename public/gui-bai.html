<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Gửi bài cho cô · Cây Kí Ức</title>
  <link rel="stylesheet" href="./cay-portal.css">
  <style>
    body.cay-submit { display:block; min-height:100dvh; margin:0; padding:max(22px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left)); }
    .cay-entry { width:min(680px,100%); margin:auto; }
    .cay-entry h1 { margin:0; }
    .cay-entry > p { line-height:1.6; }
    .cay-entry fieldset { min-width:0; margin:0; padding:0; border:0; display:grid; gap:14px; }
    .cay-entry label { display:grid; gap:6px; font-size:.85rem; font-weight:600; }
    .cay-entry input, .cay-entry select, .cay-entry textarea {
      width:100%; min-height:44px; padding:10px 12px; border:1px solid #e2c8944a;
      border-radius:9px; font-family:inherit; font-size:16px; background:#1a2921; color:#f4ecdc;
    }
    .cay-entry textarea { resize:vertical; line-height:1.5; }
    .cay-entry small { color:#ded0b8; line-height:1.5; font-weight:400; }
    .cay-entry .cay-entry-person { display:grid; grid-template-columns:2fr minmax(124px,1fr); gap:12px; }
    .cay-entry button[type="submit"] { min-height:44px; padding:8px 16px; border:1px solid #d9b26a; border-radius:9px; background:#d9b26a; color:#1f2d24; font-family:inherit; font-size:1rem; font-weight:600; cursor:pointer; }
    .cay-entry button:disabled { opacity:.62; cursor:wait; }
    .cay-entry .cay-status { margin:0; min-height:1.5em; line-height:1.5; overflow-wrap:anywhere; }
    .cay-entry .cay-status[data-error] { color:#ffd8cf; }
    .cay-entry .cay-status[data-success] { color:#e6d5a4; }
    @media (max-width:420px) { .cay-entry .cay-entry-person { grid-template-columns:1fr; } }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.3/dist/umd/supabase.min.js"></script>
  <script defer src="./cay-config.js"></script>
  <script defer src="./gui-bai.js"></script>
</head>
<body class="cay-chooser cay-surface cay-submit" data-cay-surface>
  <main class="cay-sheet cay-entry">
    <h1>Gửi bài cho cô</h1>
    <p>Trang quản lý nhận bài để đưa lên cây. Khi xem cây, mọi người có thể đọc lời chúc. Tâm sự và ảnh đính kèm cần mã riêng của cô.</p>
    <form id="submissionForm">
      <fieldset id="submissionFields">
        <div class="cay-entry-person">
          <label>Họ và tên<input name="studentName" autocomplete="name" required minlength="2" maxlength="100"></label>
          <label>Số thứ tự trong lớp<input name="studentNumber" inputmode="numeric" pattern="[0-9]{1,5}" maxlength="5" required></label>
        </div>
        <label>Cô nhận
          <select name="teacher" required>
            <option value="">Chọn cô</option>
            <option value="co-1">Cô 1</option><option value="co-2">Cô 2</option>
            <option value="co-3">Cô 3</option><option value="co-4">Cô 4</option>
          </select>
        </label>
        <label>Lời chúc<textarea name="wish" rows="3" maxlength="3000"></textarea></label>
        <label>Tâm sự riêng<textarea name="story" rows="5" maxlength="12000"></textarea></label>
        <label>Ảnh đính kèm (nếu có)
          <input name="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple>
          <small>Tối đa 3 ảnh JPG, PNG hoặc WebP, mỗi ảnh tối đa 10 MB.</small>
        </label>
        <button id="submissionButton" type="submit">Gửi bài</button>
      </fieldset>
      <p class="cay-status" id="submissionStatus" role="status" aria-live="polite"></p>
    </form>
  </main>
</body>
</html>
